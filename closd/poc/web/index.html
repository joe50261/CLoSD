<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLoSD WebGPU PoC — Parity Harness</title>
    <style>
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             max-width: 1100px; margin: 1em auto; padding: 0 1em; }
      h1 { font-size: 1.1em; }
      button { font: inherit; padding: 0.5em 1em; cursor: pointer; }
      pre { background: #f4f4f4; padding: 1em; overflow: auto;
            border: 1px solid #ddd; border-radius: 4px; }
      #log { height: 200px; }
      #result { white-space: pre; }
      .row { display: flex; gap: 1em; align-items: center; margin: 1em 0; }
    </style>
  </head>
  <body>
    <h1>CLoSD DiP — WebGPU parity harness</h1>
    <p>
      Loads the exported DiP trunk (ONNX FP16, WebGPU EP), runs CLIP via
      transformers.js, runs the AR denoise loop, and compares each step
      against the Python reference fixtures. PASS/FAIL per tensor below.
    </p>
    <div class="row">
      <button id="run">Run parity check</button>
    </div>
    <h2>Log</h2>
    <pre id="log"></pre>
    <h2>Report</h2>
    <pre id="result"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
